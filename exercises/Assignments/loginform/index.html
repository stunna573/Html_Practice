<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
         div {
            display: inline-block;
           text-align: center;
           padding: 80px 60px;
           

        }
        #lol{
            background-color: darkblue;
          
        }
        #toll{
            background-color: white;
        }
        input{
            padding: 10px 50px;

        }
        

            
    </style>
</head>
<body style="background-color: aquamarine;">
    
    
    

      <form action="" method="post" style="text-align: center; margin-top: 100px;"> 
        <div>
            <div id="lol">

              <h4 style="text-align: left; margin-top: -57px; color: white; " ;  >TOP HTML</h4>
                <br>
              <p style="color: white; text-align: left;">Login using social media to get <br> quick access</p>
                <br>
              <input type="button" value="Sign in with Facebook" style="background-color: blue; margin-bottom: 20px; padding: 10px 45px; color: white;">
                <br>
              <input type="button" value="Sign in with Twitter" style="background-color: aqua; margin-bottom: 20px; color: white;">
                <br>
              <input type="button" value="Sign in with Google" style="background-color: red; margin-bottom: 20px; color: white;">

            </div>

            <div id="toll">
              <h2 style="margin-top: -57px ;">Login to your account</h2>
              <p>Don't have an account?  <u style="color:blue ;">Sign up for free</u></p> 
                <br>
              <input type="text" placeholder="Email address" style="margin-bottom: 20px; padding: 10px 100px;" >
                <br>
              <input type="text" placeholder="Password" style="margin-bottom: 20px; padding: 10px 100px;" >
                <br>
              <input type="checkbox" value="" id="remember">
              <label for="remember" style="margin-right: 100px;">Remember me</label>                  <u style="color: blue;"> Forgot password?</u>
                <br>
              <input type="button" value="Login with email" style="background-color: blue; margin-top: 20px; padding: 15px 100px; margin-bottom: 14px;" >

            </div>

        </div>
      </form>
    
    
</body>
</html>
