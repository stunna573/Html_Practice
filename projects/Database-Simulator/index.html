<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database || Simulation</title>
    <link rel="stylesheet" href="./index.css">
    <style>
      #table {
       background-color: #525252;
       padding: 20px;
       color: white;
      }

     #dataTable {
       width: 60%;
       margin: 0 auto;
       border-collapse: collapse;
       color: white;    
      }

      th, td {
       border: 1px solid #DDDDDD;
       padding: 8px;
     }

     th {
       background-color: #494949;
       padding-top: 12px; 
       padding-bottom: 12px; 
       text-align: left;
     }

     h2{
       text-align: center;
     }
    </style>
</head>
<body id="body">
  <form id="myForm" autocomplete="on">
    <label for="city">Enter city:</label>
    <input type="text" id="city" name="city" autocomplete="address-level3"></br></br>
    <label for="country">Enter country:</label>
    <input type="text" id="country" name="country" autocomplete="address-level3"></br></br>
    <button type="button" id="submitBtn">submit</button>
  </form> 

 <div id="table">
  <h2>Database Simulation</h2>
  <table id="dataTable">
    <tr>
      <th>city</th>
      <th>country</th>
    </tr>
  </table>
</div>


<script src="./index.js"></script>
</body>
</html>
